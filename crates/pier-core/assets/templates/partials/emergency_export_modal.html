<!-- Emergency export modal. Open with
     $dispatch('emergency-export', { url: '/api/v1/.../export', title: 'name' }) -->
<div x-data="emergencyExport()" x-on:emergency-export.window="show($event.detail)"
     x-show="open" x-cloak
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-[9999]"
     style="top:0;left:0"
     @click.self="if (!busy) open = false">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-6 w-full max-w-md mx-4 shadow-xl">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">{{ t('emergency_export.title') }}</h3>
        <p class="text-sm font-mono text-gray-500 dark:text-gray-400 mb-3 truncate" x-text="title"></p>

        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700/40 rounded-lg px-3 py-2 mb-4 space-y-1">
            <p class="text-xs text-amber-800 dark:text-amber-200">{{ t('emergency_export.warning_secrets') }}</p>
            <p class="text-xs text-amber-700 dark:text-amber-400">{{ t('emergency_export.note_contents') }}</p>
        </div>

        <div x-show="requirePw" class="mb-3">
            <label class="block text-xs text-gray-500 mb-1">{{ t('emergency_export.account_password') }}</label>
            <input x-model="accountPassword" type="password" autocomplete="current-password"
                   class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="mb-3">
            <label class="block text-xs text-gray-500 mb-1">{{ t('emergency_export.archive_password') }}</label>
            <input x-model="archivePassword" type="password" autocomplete="new-password"
                   class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">{{ t('emergency_export.archive_password_repeat') }}</label>
            <input x-model="archivePassword2" type="password" autocomplete="new-password" @keydown.enter="submit()"
                   class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <p class="text-xs text-gray-500 mt-2">{{ t('emergency_export.archive_password_hint') }}</p>
        <p x-show="archivePassword2 && archivePassword !== archivePassword2" class="text-xs text-red-500 mt-1">{{ t('emergency_export.passwords_mismatch') }}</p>

        <div class="flex justify-end gap-2 mt-5">
            <button @click="open = false" :disabled="busy"
                    class="px-4 py-2 text-sm rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors disabled:opacity-50">
                {{ t('common.cancel') }}
            </button>
            <button @click="submit()" :disabled="!canSubmit"
                    :class="canSubmit ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'"
                    class="px-4 py-2 text-sm font-medium rounded-lg transition-colors">
                <span x-text="busy ? '{{ t('emergency_export.building') }}' : '{{ t('emergency_export.download') }}'"></span>
            </button>
        </div>
    </div>
</div>
<script>
function emergencyExport() {
    return {
        open: false, busy: false, url: '', title: '', requirePw: true,
        accountPassword: '', archivePassword: '', archivePassword2: '',
        get canSubmit() {
            return !this.busy
                && this.archivePassword.length >= 8
                && this.archivePassword === this.archivePassword2
                && (!this.requirePw || this.accountPassword);
        },
        async show(detail) {
            this.url = detail.url;
            this.title = detail.title || '';
            this.accountPassword = this.archivePassword = this.archivePassword2 = '';
            this.open = true;
            try {
                const s = await api('/api/v1/security/settings');
                this.requirePw = !!s.require_password_on_delete;
            } catch (e) {
                // Fail closed, same as the delete modals.
                this.requirePw = true;
            }
        },
        async submit() {
            if (!this.canSubmit) return;
            this.busy = true;
            try {
                const res = await fetch(this.url, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: this.accountPassword || null,
                        archive_password: this.archivePassword,
                    }),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || '{{ t('common.request_failed') }}');
                }
                const disp = res.headers.get('Content-Disposition') || '';
                const m = disp.match(/filename="([^"]+)"/);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = m ? m[1] : 'pier-export.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                this.open = false;
                toast('{{ t('emergency_export.toast_downloaded') }}');
            } catch (e) {
                toast(e.message, 'error');
            } finally {
                this.busy = false;
                this.accountPassword = this.archivePassword = this.archivePassword2 = '';
            }
        },
    };
}
</script>
